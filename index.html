<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#222222">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Сотовые аксессуары</title>
<style>
:root{--bg:#222;--card:#111;--txt:#fff;--mut:#8a8a8a;--grn:#28a745;--cyan:#17a2b8;--red:#dc3545;--blue:#007bff;--pur:#d58cff;--ok:#4caf50}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Roboto,sans-serif;padding:14px;padding-bottom:80px;font-size:16px}
.card{background:var(--card);border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px #0006}
h1{font-size:26px;margin:0 0 14px;font-weight:600}
h2{font-size:22px;margin:0 0 14px;font-weight:600}
.addr{color:var(--mut);font-size:15px;margin-bottom:16px}
.inc{font-size:22px;margin:10px 0;font-weight:500}
.mine{color:var(--ok)}.others{color:var(--pur)}.bal{color:#ffc107}
.btn{display:block;width:100%;border:0;border-radius:10px;padding:16px;margin-bottom:12px;color:#fff;font-size:20px;font-weight:500;cursor:pointer}
.btn:active{filter:brightness(.8)}
.g{background:var(--grn)}.c{background:var(--cyan)}.r{background:var(--red)}.b{background:var(--blue)}.d{background:#444}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2 .btn{font-size:17px;padding:14px 6px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{background:var(--blue);padding:10px 8px;text-align:left;border:1px solid #1a5fc4}
td{padding:9px 8px;border-bottom:1px solid #2a2a2a}
.tbl{overflow-x:auto}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;z-index:10}
.modal.show{display:flex}
.sheet{background:#1b1b1b;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px}
label{display:block;color:var(--mut);font-size:14px;margin:12px 0 4px}
input,select{width:100%;padding:13px;border-radius:10px;border:1px solid #333;background:#0c0c0c;color:#fff;font-size:17px}
.res{background:#0c0c0c;border-radius:12px;padding:14px;margin:14px 0;line-height:1.7}
.res b{color:var(--ok)}
.item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #2a2a2a;gap:8px}
.item small{color:var(--mut);display:block}
.x{background:#600;color:#fff;border:0;border-radius:8px;padding:8px 12px}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{flex:1;padding:10px;border-radius:8px;border:0;background:#333;color:#fff;font-size:15px}
.tabs button.on{background:var(--blue)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#333;padding:12px 20px;border-radius:12px;display:none;z-index:20}
#upd{display:none;position:fixed;top:0;left:0;right:0;background:var(--grn);text-align:center;padding:12px;z-index:30;font-weight:600}
.ver{color:var(--mut);font-size:12px;text-align:center}
</style>
</head>
<body>
<div id="upd" onclick="location.reload()">🔄 Жаңы версия бар — басыңыз</div>

<div class="card">
  <h1 id="shopName">«Сотовые аксессуары»</h1>
  <div class="addr">Кара-Балта, Верхний рынок, Береке, ул. Свердлова 51/2</div>
  <div class="addr" style="margin-top:-8px">📲 Акча түшөт: <b style="color:#fff">0556-652-652</b></div>
  <div class="inc mine">Сиздин жалпы кирешеңиз: <span id="tMine">0</span> сом</div>
  <div class="inc others">Башкалардын кирешеси: <span id="tOthers">0</span> сом</div>
  <div class="inc bal">Чыгарууга баланс: <span id="tBal">0</span> сом</div>
</div>

<button class="btn g" onclick="openSale('sale')">➕ Жаңы сатуу</button>
<button class="btn c" onclick="openSale('service')">➕ Жаңы кызмат</button>
<button class="btn b" onclick="openSale('sub')">👥 Кардарды жазуу (подписка)</button>
<button class="btn r" onclick="openWd()">💸 Баланс чыгаруу (О!Деньги / Mega / Beeline)</button>
<div class="row2">
  <button class="btn d" onclick="openCalc()">🧮 Калькулятор</button>
  <button class="btn d" onclick="openCat()">📦 Товар/кызмат тизмеси</button>
  <button class="btn d" onclick="openClients()">👤 Кардарлар</button>
  <button class="btn d" onclick="openSet()">⚙️ Жөндөөлөр</button>
</div>

<div class="card" style="margin-top:16px">
  <h2>Акыркы операциялар</h2>
  <div class="tbl"><table><thead><tr><th>Күнү</th><th>Түрү</th><th>Сумма</th><th>Сиздин %</th></tr></thead><tbody id="ops"></tbody></table></div>
</div>
<div class="ver" id="ver"></div>

<div class="modal" id="m"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
const VERSION='1.2.0';
const KEY='sotaks_v1';
const OPS={mega:'Mega',odengi:'О!Деньги',beeline:'Beeline'};
const $=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fmt=n=>(Math.round(n*100)/100).toLocaleString('ru-RU');
const today=()=>{const d=new Date();return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})};

let S=JSON.parse(localStorage.getItem(KEY)||'null')||{
  products:[
    {id:uid(),type:'sale',name:'Чехол',price:300,percent:95},
    {id:uid(),type:'sale',name:'Наушники',price:500,percent:95},
    {id:uid(),type:'sale',name:'Зарядка',price:400,percent:95},
    {id:uid(),type:'service',name:'Стекло жабыштыруу',price:150,percent:95},
    {id:uid(),type:'service',name:'Телефон оңдоо',price:500,percent:95},
    {id:uid(),type:'sub',name:'Айлык подписка',price:200,percent:95}
  ],
  ops:[],withdrawals:[],clients:[],
  settings:{myPhone:'0556652652',operator:'odengi',regBonus:50}
};
if(!S.settings.myPhone)S.settings.myPhone='0556652652';
if(!S.settings.p95){S.products.forEach(p=>p.percent=95);S.settings.p95=true;localStorage.setItem(KEY,JSON.stringify(S))}
const save=()=>{localStorage.setItem(KEY,JSON.stringify(S));render()};
const TYPE={sale:'Сатуу',service:'Кызмат',sub:'Подписка',reg:'Каттоо'};

function render(){
  const mine=S.ops.reduce((a,o)=>a+o.mine,0);
  const oth=S.ops.reduce((a,o)=>a+o.others,0);
  const wd=S.withdrawals.reduce((a,w)=>a+w.sum,0);
  $('tMine').textContent=fmt(mine);$('tOthers').textContent=fmt(oth);$('tBal').textContent=fmt(mine-wd);
  $('ops').innerHTML=S.ops.slice(-30).reverse().map(o=>`<tr><td>${o.date}</td><td>${TYPE[o.type]}: ${o.name}</td><td>${fmt(o.sum)}</td><td>${fmt(o.mine)}</td></tr>`).join('')||'<tr><td colspan="4" style="color:#777">Азырынча операция жок</td></tr>';
  $('ver').textContent='v'+VERSION;
}
const balance=()=>S.ops.reduce((a,o)=>a+o.mine,0)-S.withdrawals.reduce((a,w)=>a+w.sum,0);
function show(html){$('sheet').innerHTML=html;$('m').classList.add('show')}
function closeM(){$('m').classList.remove('show')}
$('m').addEventListener('click',e=>{if(e.target.id==='m')closeM()});
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}
const closeBtn='<button class="btn d" onclick="closeM()">Жабуу</button>';

/* ===== САТУУ / КЫЗМАТ / ПОДПИСКА ===== */
let cur=null;
function openSale(type){
  cur=type;
  const list=S.products.filter(p=>p.type===type);
  const title={sale:'Жаңы сатуу',service:'Жаңы кызмат',sub:'Кардарды жазуу (подписка)'}[type];
  show(`<h2>${title}</h2>
  <label>Тандаңыз</label>
  <select id="sp" onchange="fillSale()">${list.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}<option value="custom">✏️ Башка (өзүм жазам)</option></select>
  <div id="cust" style="display:none"><label>Аты</label><input id="cn" placeholder="Аталышы" oninput="calcSale()"></div>
  <label>Баасы (сом)</label><input id="cp" type="number" inputmode="decimal" oninput="calcSale()">
  <div class="row2">
    <div><label>Менин % (0556-652-652)</label><input id="cpc" type="number" inputmode="decimal" oninput="pcMine()"></div>
    <div><label>Кардардын %</label><input id="ccl" type="number" inputmode="decimal" oninput="pcCl()"></div>
  </div>
  <label>Саны</label><input id="sq" type="number" inputmode="numeric" value="1" min="1" oninput="calcSale()">
  ${type==='sub'?`<label>Кардардын аты</label><input id="cln" placeholder="Аты-жөнү"><label>Кардардын номери</label><input id="clp" type="tel" placeholder="0700 123 456">`:''}
  <div class="res" id="sr"></div>
  <button class="btn g" onclick="doSale()">✅ Сактоо</button>${closeBtn}`);
  fillSale();
}
function fillSale(){
  const v=$('sp').value;
  $('cust').style.display=v==='custom'?'block':'none';
  if(v!=='custom'){
    const p=S.products.find(x=>x.id===v);
    if(p){$('cp').value=p.price;$('cpc').value=p.percent;$('ccl').value=100-p.percent}
  }else{
    if(!$('cpc').value){$('cpc').value=95;$('ccl').value=5}
  }
  calcSale();
}
function pcMine(){const m=Math.min(100,Math.max(0,+$('cpc').value||0));$('ccl').value=100-m;calcSale()}
function pcCl(){const c=Math.min(100,Math.max(0,+$('ccl').value||0));$('cpc').value=100-c;calcSale()}
function saleData(){
  const q=Math.max(1,+$('sq').value||1);
  let name;
  if($('sp').value==='custom'){name=$('cn').value||'Башка'}
  else{const p=S.products.find(x=>x.id===$('sp').value);name=p?p.name:'Башка'}
  const price=+$('cp').value||0,pc=+$('cpc').value||0;
  const sum=price*q,mine=sum*pc/100;
  return {name,price,pc,q,sum,mine,others:sum-mine};
}
function calcSale(){
  const d=saleData();
  $('sr').innerHTML=`Жалпы сумма: <b>${fmt(d.sum)} сом</b><br>Сиздин ${d.pc}%: <b>${fmt(d.mine)} сом</b> → 0556-652-652<br>Кардардын ${100-d.pc}%: <span style="color:#d58cff">${fmt(d.others)} сом</span>`;
}
function doSale(){
  const d=saleData();if(!d||d.sum<=0)return toast('Баасын текшериңиз');
  if(cur==='sub'){
    const n=$('cln').value.trim(),ph=$('clp').value.trim();
    if(!n||!ph)return toast('Кардардын атын жана номерин жазыңыз');
    S.clients.push({id:uid(),name:n,phone:ph,plan:d.name,date:today()});
  }
  S.ops.push({id:uid(),date:today(),type:cur,name:d.name+(d.q>1?' ×'+d.q:''),sum:d.sum,mine:d.mine,others:d.others});
  save();closeM();toast('Сакталды ✔');
}

/* ===== БАЛАНС ЧЫГАРУУ ===== */
function openWd(){
  const st=S.settings;
  show(`<h2>💸 Баланс чыгаруу</h2>
  <div class="res">Жеткиликтүү баланс: <b>${fmt(balance())} сом</b></div>
  <label>Оператор</label>
  <select id="wo">${Object.entries(OPS).map(([k,v])=>`<option value="${k}" ${st.operator===k?'selected':''}>${v}</option>`).join('')}</select>
  <label>Номериңиз</label><input id="wp" type="tel" value="${st.myPhone}" placeholder="0700 123 456">
  <label>Сумма (сом)</label><input id="ws" type="number" inputmode="decimal" oninput="calcWd()">
  <div class="res" id="wr">Комиссия жок деп эсептелет</div>
  <label>Комиссия % (оператордун, каалаганыңызча)</label><input id="wc" type="number" inputmode="decimal" value="0" oninput="calcWd()">
  <button class="btn r" onclick="doWd()">Чыгарууга жазуу</button>
  <button class="btn d" onclick="copyWd()">📋 Номерди көчүрүү</button>
  <div class="item"><span><b>Чыгаруулар тарыхы</b></span></div>
  ${S.withdrawals.slice(-8).reverse().map(w=>`<div class="item"><span>${w.date}<small>${OPS[w.op]} · ${w.phone}</small></span><b>−${fmt(w.sum)}</b></div>`).join('')||'<small style="color:#777">Жок</small>'}
  ${closeBtn}`);
}
function calcWd(){const s=+$('ws').value||0,c=+$('wc').value||0;const fee=s*c/100;$('wr').innerHTML=`Комиссия: ${fmt(fee)} сом<br>Номериңизге түшөт: <b>${fmt(s-fee)} сом</b>`}
function doWd(){
  const s=+$('ws').value,p=$('wp').value.trim();
  if(!s||s<=0)return toast('Сумманы жазыңыз');
  if(s>balance())return toast('Баланс жетишсиз');
  if(!p)return toast('Номерди жазыңыз');
  S.settings.myPhone=p;S.settings.operator=$('wo').value;
  S.withdrawals.push({id:uid(),date:today(),op:$('wo').value,phone:p,sum:s});
  save();closeM();toast('Чыгарууга жазылды ✔');
}
function copyWd(){const p=$('wp').value;navigator.clipboard&&navigator.clipboard.writeText(p);toast('Көчүрүлдү')}

/* ===== КАЛЬКУЛЯТОР ===== */
function openCalc(){
  show(`<h2>🧮 Калькулятор</h2>
  <label>Товар/кызмат баасы (сом)</label><input id="k1" type="number" inputmode="decimal" oninput="kc()">
  <label>Алган баасы (себи), сом</label><input id="k2" type="number" inputmode="decimal" oninput="kc()">
  <label>Саны</label><input id="k3" type="number" inputmode="numeric" value="1" oninput="kc()">
  <label>Сиздин % (кирешеден эмес, сумманын %)</label><input id="k4" type="number" inputmode="decimal" value="95" oninput="kc()">
  <label>Оператор комиссиясы % (Mega/О!Деньги/Beeline)</label><input id="k5" type="number" inputmode="decimal" value="0" oninput="kc()">
  <div class="res" id="kr"></div>${closeBtn}`);kc();
}
function kc(){
  const p=+$('k1').value||0,c=+$('k2').value||0,q=+$('k3').value||1,pc=+$('k4').value||0,f=+$('k5').value||0;
  const sum=p*q,share=sum*pc/100,fee=share*f/100,prof=sum-c*q;
  $('kr').innerHTML=`Жалпы: <b>${fmt(sum)}</b> сом<br>Таза пайда (баа − себи): <b>${fmt(prof)}</b> сом<br>Сиздин %: <b>${fmt(share)}</b> сом<br>Комиссия: ${fmt(fee)} сом<br>Номериңизге түшөт: <b>${fmt(share-fee)}</b> сом`;
}

/* ===== КАТАЛОГ ===== */
let ctab='sale',editId=null;
function openCat(){
  editId=null;
  const L=S.products.filter(p=>p.type===ctab);
  show(`<h2>📦 Товар жана кызматтар</h2>
  <div class="tabs">${['sale','service','sub'].map(t=>`<button class="${ctab===t?'on':''}" onclick="ctab='${t}';openCat()">${{sale:'Товар',service:'Кызмат',sub:'Подписка'}[t]}</button>`).join('')}</div>
  ${L.map(p=>`<div class="item"><span>${p.name}<small>${p.price} сом · Мен ${p.percent}% · Кардар ${100-p.percent}%</small></span><span><button class="x" style="background:#07a" onclick="editP('${p.id}')">✏️</button> <button class="x" onclick="delP('${p.id}')">✕</button></span></div>`).join('')||'<small style="color:#777">Бош</small>'}
  <h2 style="margin-top:18px" id="ph">Жаңы кошуу</h2>
  <label>Аты</label><input id="pn">
  <label>Баасы (сом)</label><input id="pp" type="number" inputmode="decimal">
  <div class="row2">
    <div><label>Менин %</label><input id="ppc" type="number" inputmode="decimal" value="95" oninput="$('pcl').value=100-(+this.value||0)"></div>
    <div><label>Кардардын %</label><input id="pcl" type="number" inputmode="decimal" value="5" oninput="$('ppc').value=100-(+this.value||0)"></div>
  </div>
  <button class="btn g" id="pb" style="margin-top:14px" onclick="addP()">➕ Кошуу</button>${closeBtn}`);
}
function editP(id){
  const p=S.products.find(x=>x.id===id);if(!p)return;
  editId=id;
  $('pn').value=p.name;$('pp').value=p.price;$('ppc').value=p.percent;$('pcl').value=100-p.percent;
  $('ph').textContent='Өзгөртүү: '+p.name;$('pb').textContent='💾 Сактоо';
  $('pn').scrollIntoView({behavior:'smooth'});
}
function addP(){
  const n=$('pn').value.trim(),p=+$('pp').value,pc=Math.min(100,Math.max(0,+$('ppc').value||0));
  if(!n||!p)return toast('Аты жана баасы керек');
  if(editId){const x=S.products.find(z=>z.id===editId);if(x){x.name=n;x.price=p;x.percent=pc}}
  else S.products.push({id:uid(),type:ctab,name:n,price:p,percent:pc});
  save();openCat();toast('Сакталды ✔');
}
function delP(id){S.products=S.products.filter(p=>p.id!==id);save();openCat()}

/* ===== КАРДАРЛАР ===== */
function openClients(){
  show(`<h2>👤 Кардарлар (${S.clients.length})</h2>
  ${S.clients.slice().reverse().map(c=>`<div class="item"><span>${c.name}<small>${c.phone} · ${c.plan} · ${c.date}</small></span><a href="tel:${c.phone}" style="color:#4caf50;font-size:22px;text-decoration:none">📞</a></div>`).join('')||'<small style="color:#777">Кардар жок</small>'}
  ${closeBtn}`);
}

/* ===== ЖӨНДӨӨЛӨР ===== */
function openSet(){
  show(`<h2>⚙️ Жөндөөлөр</h2>
  <label>Дүкөндүн аты</label><input id="sn" value="${(localStorage.getItem('shopname')||'«Сотовые аксессуары»')}">
  <label>Менин номерим (акча түшчү)</label><input id="sm" type="tel" value="${S.settings.myPhone}">
  <button class="btn g" style="margin-top:14px" onclick="saveSet()">Сактоо</button>
  <button class="btn b" onclick="exportD()">⬇️ Резервдик көчүрмө (JSON)</button>
  <button class="btn b" onclick="$('imp').click()">⬆️ Калыбына келтирүү</button>
  <input type="file" id="imp" accept=".json" style="display:none" onchange="importD(this)">
  <button class="btn r" onclick="if(confirm('Бардык маалымат өчөт!')){localStorage.removeItem(KEY);location.reload()}">🗑 Баарын тазалоо</button>
  <button class="btn d" onclick="checkUpd(true)">🔄 Жаңыланууну текшерүү</button>${closeBtn}`);
}
function saveSet(){localStorage.setItem('shopname',$('sn').value);S.settings.myPhone=$('sm').value;$('shopName').textContent=$('sn').value;save();closeM()}
function exportD(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='sotaks-backup.json';a.click()}
function importD(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);save();closeM();toast('Калыбына келди ✔')}catch(e){toast('Файл туура эмес')}};r.readAsText(f)}

/* ===== АВТО-ЖАҢЫЛАНУУ (GitHub Pages) ===== */
async function checkUpd(manual){
  try{
    const r=await fetch('index.html?t='+Date.now(),{cache:'no-store'});
    const t=await r.text();
    const m=t.match(/const VERSION='([^']+)'/);
    if(m&&m[1]!==VERSION){$('upd').style.display='block'}
    else if(manual)toast('Эң жаңы версия ✔');
  }catch(e){if(manual)toast('Интернет жок')}
}
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(reg=>{
    reg.addEventListener('updatefound',()=>{const w=reg.installing;w&&w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)$('upd').style.display='block'})});
  }).catch(()=>{});
}
setInterval(()=>checkUpd(false),5*60*1000);
window.addEventListener('focus',()=>checkUpd(false));
checkUpd(false);

$('shopName').textContent=localStorage.getItem('shopname')||'«Сотовые аксессуары»';
render();
</script>
</body>
</html>
